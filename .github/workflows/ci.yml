name: PR checks

# MCP_FIXES.md section 4.2 (29/10/2026): deploy.yml ran tsc and the tests only on a push to main, after the merge,
# so a broken test blocked a deploy instead of a PR. This runs the same steps on every PR, with no credentials and
# no deploy. The contract drift job compares this repo's vendored wayfinder rules with wayfinder itself.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Type check, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      # The same as deploy.yml: scripts/run_tests.mjs lists every test and points Firestore at a dead loopback port.
      - run: npm run build
      - run: npm test

  # The wayfinder half of the cross-repo contract (wayfinder tools/check_gateway_contract_drift.mjs), against the
  # wayfinder branch of the SAME NAME when one exists (a lockstep pair), else wayfinder main. wayfinder is private:
  # skipped with a visible warning until Brad adds WAYFINDER_READONLY_TOKEN (fine-grained, contents:read on
  # theDonk/wayfinder), the same secret name pelaris-admin's CI uses.
  wayfinder-contract-drift:
    name: Wayfinder contract drift
    runs-on: ubuntu-latest
    env:
      WAYFINDER_TOKEN: ${{ secrets.WAYFINDER_READONLY_TOKEN }}
      HEAD_REF: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@v4
      - if: env.WAYFINDER_TOKEN == ''
        run: echo "::warning::WAYFINDER_READONLY_TOKEN is not set; the wayfinder contract drift check did not run."
      - if: env.WAYFINDER_TOKEN != ''
        name: Check out the paired wayfinder branch (read-only, sparse)
        run: |
          set -euo pipefail
          url="https://x-access-token:${WAYFINDER_TOKEN}@github.com/theDonk/wayfinder.git"
          ref=main
          if [ -n "${HEAD_REF:-}" ] && git ls-remote --exit-code --heads "$url" "$HEAD_REF" >/dev/null 2>&1; then ref="$HEAD_REF"; fi
          echo "Wayfinder ref: $ref"
          git clone --depth 1 --filter=blob:none --sparse --branch "$ref" "$url" "$RUNNER_TEMP/wayfinder"
          git -C "$RUNNER_TEMP/wayfinder" sparse-checkout set tools functions/src
      - if: env.WAYFINDER_TOKEN != ''
        run: node "$RUNNER_TEMP/wayfinder/tools/check_gateway_contract_drift.mjs" "$GITHUB_WORKSPACE"
