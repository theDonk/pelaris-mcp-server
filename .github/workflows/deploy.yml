name: Deploy MCP Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      PROJECT_ID: wayfinder-ai-fitness
      REGION: australia-southeast1
      SERVICE_NAME: pelaris-mcp-server

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Type check before deploying
      - run: npx tsc --noEmit

      # Build, then run every test (scripts/run_tests.mjs lists them explicitly
      # and points Firestore at a dead loopback port). These run BEFORE the
      # cloud credentials load, so no test can reach a cloud service. A failing
      # test blocks the deploy. Rollback: gcloud run services update-traffic
      # pelaris-mcp-server --to-revisions <previous>=100 --region australia-southeast1
      # --project wayfinder-ai-fitness
      - run: npm run build
      - run: npm test

      - id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # Deploy to Cloud Run (--source uses Dockerfile, preserves existing env/secrets)
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      - name: Deploy to Cloud Run
        # The service URL gcloud prints is masked in the log.
        run: |
          set -o pipefail
          gcloud run deploy $SERVICE_NAME \
            --source . \
            --project $PROJECT_ID \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --quiet 2>&1 | sed -E 's#https://[A-Za-z0-9.-]+[.]run[.]app#<service-url>#g'

      - name: Verify deployment
        run: |
          URL=$(gcloud run services describe $SERVICE_NAME \
            --project $PROJECT_ID \
            --region $REGION \
            --format 'value(status.url)')
          echo "::add-mask::$URL"
          HTTP_STATUS=$(curl -s -o /tmp/health.json -w "%{http_code}" "$URL/health")
          echo "Health check (direct): $HTTP_STATUS"
          cat /tmp/health.json
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Health check failed with status $HTTP_STATUS"
            exit 1
          fi
          # Verify custom domain also serves new version
          echo ""
          DOMAIN_STATUS=$(curl -s -o /tmp/domain_health.json -w "%{http_code}" "https://api.pelaris.io/health")
          echo "Health check (api.pelaris.io): $DOMAIN_STATUS"
          cat /tmp/domain_health.json
